<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance Scanner</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0f2f5; color: #333; }
  .header {
    background: linear-gradient(135deg, #ff6f00, #e65100); color: white;
    padding: 16px 20px; text-align: center;
  }
  .header h1 { font-size: 18px; }
  .header p { opacity: .85; font-size: 12px; margin-top: 3px; }
  .container { max-width: 520px; margin: 15px auto; padding: 0 12px; }
  .card {
    background: white; border-radius: 12px; padding: 18px;
    box-shadow: 0 2px 10px rgba(0,0,0,.08); margin-bottom: 12px;
  }
  label { display: block; font-weight: 600; font-size: 12px; margin-bottom: 4px; color: #555; }
  select, input {
    width: 100%; padding: 9px 10px; border: 2px solid #ddd; border-radius: 8px;
    font-size: 14px; margin-bottom: 10px;
  }
  .toggle { display: flex; border-radius: 10px; overflow: hidden; border: 3px solid #ddd; margin: 10px 0; }
  .toggle button {
    flex: 1; padding: 12px; font-size: 16px; font-weight: 700;
    border: none; cursor: pointer; background: #e0e0e0; color: #666;
  }
  .toggle .in.active { background: #0f9d58; color: white; }
  .toggle .out.active { background: #db4437; color: white; }
  .btn {
    display: inline-block; padding: 10px 22px; border: none; border-radius: 8px;
    font-weight: 600; cursor: pointer; font-size: 13px; color: white;
  }
  .btn-orange { background: #ff6f00; }
  .btn-red { background: #db4437; }
  #reader { max-width: 400px; margin: 12px auto; }
  #reader video { border-radius: 8px; }
  .result {
    padding: 12px; border-radius: 8px; text-align: center; font-size: 14px;
    font-weight: 700; display: none; margin-top: 10px;
  }
  .result.ok { background: #e6f4ea; color: #0f9d58; border: 2px solid #0f9d58; display: block; }
  .result.err { background: #fce8e6; color: #db4437; border: 2px solid #db4437; display: block; }
  .result.info { background: #fef7e0; color: #f57f17; border: 2px solid #f57f17; display: block; }
  .log { max-height: 180px; overflow-y: auto; margin-top: 10px; }
  .log-item { padding: 7px 10px; border: 1px solid #e0e0e0; border-radius: 6px; margin-bottom: 4px; font-size: 12px; background: #fafafa; }
  .center { text-align: center; }
</style>
</head>
<body>

<div class="header">
  <h1>Attendance Scanner</h1>
  <p>Scan QR / Barcode to mark IN / OUT</p>
</div>

<div class="container">

  <div class="card">
    <label>Subject</label>
    <select id="subject"><option value="">-- Select Subject --</option></select>
    <input type="text" id="manualSubject" placeholder="Or type subject name manually" style="display:none;">
    <button class="btn" style="background:#ddd;color:#333;width:100%;margin-bottom:10px;" onclick="toggleManualSubject()">Can't see subjects? Enter manually</button>

    <label>Scanner Token (optional - only if you set SCANNER_TOKEN)</label>
    <input type="text" id="token" placeholder="Leave blank if not set">
  </div>

  <div class="card">
    <div class="toggle">
      <button class="in active" onclick="setAction('IN', this)">IN</button>
      <button class="out" onclick="setAction('OUT', this)">OUT</button>
    </div>
    <div class="center">
      <button class="btn btn-orange" onclick="startScan()">Start Scanner</button>
      <button class="btn btn-red" onclick="stopScan()">Stop</button>
    </div>
    <div id="reader"></div>
    <div class="result" id="result"></div>
    <div class="log" id="log"></div>
  </div>

</div>

<script>
  var action = "IN";
  var scanner = null;
  var DEFAULT_APP_URL = "https://script.google.com/macros/s/AKfycbxMHvLvF7YYQBiayH81xHzpZJmnC4Jzr-s99_aX3dXRCO2kzV873KReqaZrkuLU-oSYRg/exec";

  function appUrl() {
    var serverAppUrl = "<?= appUrl ?>";
    if (serverAppUrl && serverAppUrl.indexOf('http') === 0) {
      return serverAppUrl;
    }
    var saved = localStorage.getItem('attAppUrl');
    if (saved) return saved;
    return DEFAULT_APP_URL;
  }

  function currentToken() {
    return document.getElementById('token').value.trim();
  }

  function apiUrl(actionName) {
    var token = currentToken();
    return appUrl() + '?action=' + actionName + (token ? '&token=' + encodeURIComponent(token) : '');
  }

  function onAppUrlChanged() {
    var url = appUrl();
    if (url && url.indexOf('http') === 0) {
      loadSubjects();
    }
  }

  function setAction(a, btn) {
    action = a;
    btn.parentElement.querySelectorAll('button').forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');
  }

  function toggleManualSubject() {
    var s = document.getElementById('manualSubject');
    s.style.display = s.style.display === 'none' ? 'block' : 'none';
  }

  function currentSubject() {
    var sel = document.getElementById('subject').value;
    var manual = document.getElementById('manualSubject').value.trim();
    return manual || sel;
  }

  function loadViaJsonp(url, onSuccess, onError) {
    var scriptId = 'jsonp_' + Math.random().toString(36).substring(7);
    window[scriptId] = function(data) {
      delete window[scriptId];
      var el = document.getElementById(scriptId);
      if (el) el.remove();
      onSuccess(data);
    };
    var script = document.createElement('script');
    script.id = scriptId;
    script.src = url + '&callback=' + scriptId;
    script.onerror = function() {
      delete window[scriptId];
      script.remove();
      if (onError) onError();
    };
    document.body.appendChild(script);
  }

  function loadData(actionName, onSuccess, onError) {
    var targetUrl = apiUrl(actionName);
    loadViaJsonp(targetUrl, function(data) {
      if (data && data.error) {
        if (onError) onError(new Error(data.error));
        return;
      }
      onSuccess(data);
    }, function() {
      fetch('https://corsproxy.io/?' + encodeURIComponent(targetUrl))
        .then(function(res) { return res.text(); })
        .then(function(text) {
          if (!text || text.trim().indexOf('<') === 0) {
            throw new Error('Apps Script returned HTML. Ensure Web App access is set to "Anyone".');
          }
          var parsed = JSON.parse(text);
          onSuccess(parsed);
        })
        .catch(function(err) {
          fetch('https://api.allorigins.win/get?url=' + encodeURIComponent(targetUrl))
            .then(function(res) { return res.json(); })
            .then(function(data) {
              var text = data.contents;
              if (!text || text.trim().indexOf('<') === 0) {
                throw new Error('Apps Script returned HTML. Ensure Web App access is set to "Anyone".');
              }
              var parsed = JSON.parse(text);
              onSuccess(parsed);
            })
            .catch(function(err2) {
              if (onError) onError(new Error('Failed to load. Ensure Web App access is set to "Anyone".'));
            });
        });
    });
  }

  function loadSubjects() {
    if (!appUrl()) return;
    loadData('subjects', function(data) {
      if (data.error) { showResult('err', data.error); return; }
      var sel = document.getElementById('subject');
      sel.innerHTML = '<option value="">-- Select Subject --</option>';
      (data || []).forEach(function(s) {
        sel.innerHTML += '<option value="' + s.name + '">' + s.name + (s.no ? ' (No ' + s.no + ')' : '') + '</option>';
      });
    }, function() {
      showResult('err', 'Cannot load subjects. Check Web App URL or use manual entry.');
    });
  }

  function startScan() {
    var subject = currentSubject();
    if (!subject) { showResult('err', 'Select a subject!'); return; }

    document.getElementById('reader').innerHTML = '';
    if (scanner) { try { scanner.clear(); } catch(e) {} }

    scanner = new Html5Qrcode('reader');
    scanner.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: { width: 220, height: 220 }, aspectRatio: 1.0 },
      function(decodedText) { handleScan(decodedText.trim()); },
      function() {}
    ).catch(function(err) {});
  }

  function stopScan() {
    if (scanner) {
      scanner.stop().then(function() { scanner.clear(); scanner = null; }).catch(function() {});
    }
  }

  function handleScan(id) {
    var subject = currentSubject();
    if (!subject) { showResult('err', 'Select a subject!'); return; }
    var url = appUrl();
    if (!url || url.indexOf('http') !== 0) { showResult('err', 'Enter Web App URL!'); return; }

    fetch(url, {
      method: 'POST',
      mode: 'no-cors',
      body: JSON.stringify({ studentId: id, subject: subject, action: action, method: 'scanner', token: currentToken() })
    })
      .then(function() {
        showResult('ok', 'Marked ' + action + ' for ' + id + ' (' + subject + ')');
        addLog(id + ' - Marked ' + action + ' for ' + subject);
      })
      .catch(function(err) {
        showResult('err', 'Network error: ' + err);
      });
  }

  function showResult(type, msg) {
    var el = document.getElementById('result');
    el.className = 'result ' + type;
    el.textContent = msg;
    setTimeout(function() { el.className = 'result'; }, 3500);
  }

  function addLog(msg) {
    var log = document.getElementById('log');
    log.innerHTML = '<div class="log-item">' + msg + '</div>' + log.innerHTML;
  }

  var serverAppUrl = "<?= appUrl ?>";
  if (serverAppUrl && serverAppUrl.indexOf('http') === 0) {
    localStorage.setItem('attAppUrl', serverAppUrl);
  }
  if (appUrl()) loadSubjects();
</script>

</body>
</html>
